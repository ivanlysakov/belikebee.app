# example-docker-compose.yml - production-ready Claude Code sandbox без IDE-інтеграції.
# Якщо потрібна VS Code інтеграція - дивись example-devcontainer.json поруч.
# Init firewall script - копія ../Lecture 7/init-firewall.sh поруч з Dockerfile.

# Single source of truth: used by docker compose (via ../docker-compose.yaml include)
# and by devcontainer.json (dockerComposeFile). Fixed project/volume names so both share one container and login.
name: belikebee

services:
  claude:
    container_name: belikebee
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Europe/Kyiv}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: 0.18.2
        ZSH_IN_DOCKER_VERSION: 1.2.0
    user: node
    working_dir: /workspace
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ..:/workspace:delegated
      - claude-config:/home/node/.claude
      - claude-history:/commandhistory
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
    entrypoint: ["/bin/bash", "-c", "sudo /usr/local/bin/init-firewall.sh && exec bash"]
    stdin_open: true
    tty: true
    mem_limit: 4g

volumes:
  claude-config:
    name: belikebee_claude-config
  claude-history:
    name: belikebee_claude-history
